version: '3.9'

services:
  # ─── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ms-express-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ms_express
      POSTGRES_PASSWORD: ms_express_dev_password
      POSTGRES_DB: ms_express
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ms_express -d ms_express']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Adminer (interface web DB) ─────────────
  adminer:
    image: adminer:latest
    container_name: ms-express-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: 'dracula'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local